[package]
name = "maplelink"
version = "0.4.7"
edition = "2021"
description = "Third-party launcher for Beanfun games"
authors = ["MapleLink"]
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["config-json5", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream", "native-tls", "form"] }
futures-util = "0.3"
cookie_store = "0.22"
cookie = "0.18"
sha2 = "0.11"
des = "0.9"
regex = "1"
url = "2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rolling-file = "0.2"
tauri-plugin-dialog = "2"
base64 = "0.22.1"
open = "5.3.4"
urlencoding = "2.1.3"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
# Passphrase-protected data export/import (pure Rust, no C toolchain needed).
aes-gcm = "0.10"
argon2 = "0.5"
# Move an imported backup file to the OS recycle bin (user's choice).
trash = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

webview2-com = "0.38"
windows-core = "0.61"

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dev-dependencies]
proptest = "1"

[lib]
name = "maplelink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maplelink"
path = "src/main.rs"

# The shipped binary is downloaded on every update, so it's worth optimising for
# size. This is a launcher: it spends its time waiting on the network and on the
# user, so trading throughput for a smaller download costs nothing anyone can
# feel. Together these take the exe from 23.4 MB to 12.6 MB.
[profile.release]
# Size over speed. "z" also drops loop vectorisation, which nothing here needs.
opt-level = "z"
# Whole-program optimisation across crate boundaries — the largest single win,
# since it lets unused paths through the dependency tree fall away.
lto = "fat"
# One unit per crate: slower to build, but no duplicated inlining between units.
codegen-units = 1
# Symbol names serve no purpose in a shipped build; panics keep file and line.
strip = true
# Deliberately NOT panic = "abort": it would save a little more, but the code
# leans on `expect()` in places (the WebView2 COM calls among them), and today a
# panic there takes down one spawned task. Aborting would take down the app.
